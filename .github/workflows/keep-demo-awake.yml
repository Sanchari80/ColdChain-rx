# The live demo runs on a free Render instance that sleeps after 15 idle minutes.
# A light request every 10 minutes keeps it awake for reviewers.
name: Keep demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the live demo
        run: curl --silent --show-error --max-time 90 --retry 2 https://coldchain-rx.onrender.com/api/v1/health
